# Free tier only (Render free web service + Turso free) until the project is funded.
# BEFORE applying this Blueprint: if a pcbuildsage service already exists in the
# Render dashboard, make `name` and `region` below match it exactly (the region
# here is a placeholder, not the live service's). A service's region can't be
# changed after creation, so a mismatch can create a second (duplicate) service
# instead of updating the existing one.
services:
  - type: web
    name: pcbuildsage
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PCBUILDSAGE_DEPLOYMENT_MODE
        value: hosted-demo
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_READ_TOKEN
        sync: false
      # NOTE: do NOT set TURSO_INGEST_TOKEN on the web service.
      # It is only used by the refresh-catalog GitHub Actions workflow.
