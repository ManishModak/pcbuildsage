name: Refresh hosted catalog

on:
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-catalog-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          pip install -r scraper/requirements.txt
          playwright install chromium --with-deps

      - name: Build candidate catalog locally
        run: |
          python -m scraper \
            --profile india \
            --db "$RUNNER_TEMP/catalog.db" \
            --skip-fresh 20 \
            --concurrency 2 \
            --delay-ms 1000

      - name: Validate and publish accepted snapshot
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_INGEST_TOKEN: ${{ secrets.TURSO_INGEST_TOKEN }}
        run: npm run publish-catalog -- --db "$RUNNER_TEMP/catalog.db"

      - name: Upload scraped catalog for guides
        uses: actions/upload-artifact@v4
        with:
          name: scraped-catalog
          path: ${{ runner.temp }}/catalog.db
          retention-days: 1

  guides:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch freshly scraped catalog
        uses: actions/download-artifact@v4
        with:
          name: scraped-catalog
          path: ${{ runner.temp }}/guides-in

      - name: Build static budget guides
        run: |
          cp "${{ runner.temp }}/guides-in/catalog.db" "$RUNNER_TEMP/catalog.db"
          npm run build-guides -- --db "$RUNNER_TEMP/catalog.db" --out site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: guides
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
