name: Refresh hosted catalog

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: hosted-catalog-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          pip install -r scraper/requirements.txt
          playwright install chromium --with-deps

      - name: Build candidate catalog locally
        run: |
          python -m scraper \
            --profile india \
            --db "$RUNNER_TEMP/catalog.db" \
            --skip-fresh 20 \
            --concurrency 2 \
            --delay-ms 1000

      - name: Validate and publish accepted snapshot
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_INGEST_TOKEN: ${{ secrets.TURSO_INGEST_TOKEN }}
        run: npm run publish-catalog -- --db "$RUNNER_TEMP/catalog.db"
