name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  node-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Lint (Node)
        run: npm run lint

      - name: Typecheck (Node)
        run: npm run typecheck

      - name: Schema and Theme Contrast Validation
        run: npm run validate:data

      - name: Vitest (including Rules Engine & SHA-1 Consistency)
        run: npm run test

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/scraper/requirements.txt -r src/scraper/requirements-dev.txt
          pip install ruff

      - name: Ruff Lint Check
        run: ruff check src/scraper

      - name: Pytest (including Scraper & SHA-1 Consistency)
        run: PYTHONPATH=src pytest src/scraper/tests
