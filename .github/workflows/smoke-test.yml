name: Weekly Profile Smoke Test

on:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt -r scraper/requirements-dev.txt
          # crawl4ai / playwright setup if needed in future
          python -m playwright install --with-deps chromium

      - name: Run Smoke Tests on All Profiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed=0
          for profile in data/profiles/*.json; do
            profile_name=$(basename "$profile")

            # Template profiles point every site at a reserved example domain
            # (RFC 2606); they document the format and can never scrape.
            if jq -e '[.sites[].base_url | test("^https?://([a-z0-9-]+\\.)*example\\.(com|org|net)(/|$)")] | all' "$profile" > /dev/null; then
              echo "Skipping template profile $profile_name (example domain)."
              continue
            fi

            echo "::group::Testing profile $profile_name"
            if ! PYTHONPATH=. python3 -m scraper --test-profile "$profile"; then
              failed=1
              title="Broken Profile: $profile_name"
              # One open issue per profile: comment on it instead of opening a duplicate each week.
              existing=$(gh issue list --state open --label bug --limit 100 --json number,title \
                --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
              if [ -n "$existing" ]; then
                echo "Profile test failed for $profile_name. Commenting on issue #$existing..."
                gh issue comment "$existing" --body "Still failing in the weekly smoke test: $run_url"
              else
                echo "Profile test failed for $profile_name. Creating a GitHub issue..."
                issue_body="The weekly scheduled profile smoke test failed for profile **$profile_name**.

          Please inspect the scraper logs to identify if the selectors are outdated or if the site layout has changed: $run_url

          Auto-generated by GitHub Actions weekly smoke test job."
                gh issue create \
                  --title "$title" \
                  --body "$issue_body" \
                  --label "bug"
              fi
            else
              echo "Profile $profile_name is healthy!"
            fi
            echo "::endgroup::"
          done
          # Surface broken profiles as a failed run, not just as issues.
          exit "$failed"
