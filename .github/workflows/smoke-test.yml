name: Weekly Profile Smoke Test

on:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  issues: write
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/scraper/requirements.txt -r src/scraper/requirements-dev.txt
          # crawl4ai / playwright setup if needed in future
          python -m playwright install --with-deps chromium

      - name: Run Smoke Tests on All Profiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for profile in data/profiles/*.json; do
            profile_name=$(basename "$profile")
            echo "::group::Testing profile $profile_name"
            if ! PYTHONPATH=src python3 -m scraper --test-profile "$profile"; then
              echo "Profile test failed for $profile_name. Creating a GitHub issue..."
              gh issue create \
                --title "Broken Profile: $profile_name" \
                --body "The weekly scheduled profile smoke test failed for profile **$profile_name**.

Please inspect the scraper logs to identify if the selectors are outdated or if the site layout has changed.

Auto-generated by GitHub Actions weekly smoke test job." \
                --label "bug"
            else
              echo "Profile $profile_name is healthy!"
            fi
            echo "::endgroup::"
          done
